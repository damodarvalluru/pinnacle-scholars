<body class="result-portal">

    <!-- Functional Local Storage Query Scripts -->
<script>
window.addEventListener('load', async function () {
  var result = { ok: false };
  try {
    var waitFor = function (fn, ms) {
      ms = ms || 12000;
      return new Promise(function (resolve) {
        if (fn()) return resolve(true);
        var started = Date.now();
        var obs = new MutationObserver(function () {
          if (fn() || Date.now() - started > ms) { obs.disconnect(); resolve(fn()); }
        });
        obs.observe(document.body, { childList: true, subtree: true, attributes: true });
        setTimeout(function () { obs.disconnect(); resolve(fn()); }, ms);
      });
    };
    document.getElementById('roll-input').value = 'PS-I-2026-003';
    document.getElementById('dob-input').value = '2005-10-16';
    document.querySelector('#resultPortalForm button[type="submit"]').click();
    await waitFor(function () { return !!document.getElementById('printableResultCard'); });
    await waitFor(function () { return !document.querySelector('.lf-toast'); });

    window.__c = { printOpened: 0, printCalled: 0, downloadCalled: 0, promptCalled: 0, alertCalled: 0 };
    window.open = function () {
      window.__c.printOpened++;
      return { document: { write: function () {}, close: function () {} }, print: function () { window.__c.printCalled++; } };
    };
    window.html2pdf = function () {
      return { set: function () { return { from: function () { return { save: function () { window.__c.downloadCalled++; return Promise.resolve(); } }; } }; } };
    };
    window.prompt = function () { window.__c.promptCalled++; return null; };
    window.alert = function () { window.__c.alertCalled++; };

    var maxToasts = 0, maxInline = 0, maxSpinner = 0, kinds = [];
    var obs = new MutationObserver(function () {
      maxToasts = Math.max(maxToasts, document.querySelectorAll('.lf-toast').length);
      maxInline = Math.max(maxInline, document.querySelectorAll('.lf-inline').length);
      maxSpinner = Math.max(maxSpinner, document.querySelectorAll('.verifying-spinner').length);
      Array.prototype.forEach.call(document.querySelectorAll('.lf-toast'), function (t) {
        var k = t.getAttribute('data-kind');
        if (k && kinds.indexOf(k) === -1) kinds.push(k);
      });
    });
    obs.observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });

    var byText = function (text) {
      return Array.prototype.find.call(document.querySelectorAll('button'), function (b) { return b.textContent.indexOf(text) !== -1; });
    };
    document.querySelector('a[onclick*="forgotStudentId"]').click();
    byText('Print').click();
    byText('Download Result').click();
    byText('Close').click();
    var home = Array.prototype.find.call(document.querySelectorAll('a.back'), function (a) { return a.getAttribute('href') === 'index.html'; });
    home.setAttribute('href', '#');
    home.click();
    obs.disconnect();

    result = {
      ok: true,
      maxToasts: maxToasts,
      maxInline: maxInline,
      maxSpinner: maxSpinner,
      toastKinds: kinds,
      finalToasts: document.querySelectorAll('.lf-toast').length,
      counts: window.__c,
      overlayClosed: !document.getElementById('resultPopupOverlay')
    };
  } catch (e) {
    result = { ok: false, error: String((e && e.stack) || e) };
  }
  var pre = document.createElement('pre');
  pre.id = 'out';
  pre.textContent = 'RESULT ' + JSON.stringify(result);
  document.body.appendChild(pre);
});
</script></body>
