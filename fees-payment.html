<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fee Payment | Pinnacle Scholars</title>

<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/premium-fx.css">
<link rel="stylesheet" href="css/fees-payment.css">
<link rel="stylesheet" href="css/session-manager.css">
<link rel="stylesheet" href="css/responsive.css">

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/forgot-id.js" defer></script>
<script src="js/fees-payment.js"></script>
<script src="js/session-manager.js"></script>
<script src="js/receipt-generator.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>

<body>

<!-- DROPLETS -->

<script>

for(let i=0;i<40;i++){

    const drop=document.createElement('div');

    drop.classList.add('droplet');

    drop.style.left=Math.random()*100+'vw';

    drop.style.animationDuration=
    (Math.random()*5+5)+'s';

    drop.style.animationDelay=
    Math.random()*5+'s';

    drop.style.width=
    drop.style.height=
    (Math.random()*10+5)+'px';

    document.body.appendChild(drop);
}

</script>

<div class="payment-card">

    <h1>Fee Payment Portal</h1>

    <div class="input-box">

        <label>Enter Student ID</label>

        <input
            type="text"
            id="studentId"
            placeholder="PS-I-2026-0001"
        >
        <div class="home-link forgot-id-link">
            <a href="#" onclick="forgotStudentId(); return false;">Forgot ID?</a>
        </div>
    </div>

    <button
        class="fetch-btn" id="fetchBtn"
        onclick="fetchStudentDetails()"
    >
        Fetch Details
    </button>

    <div
        class="student-details"
        id="studentDetails"
    >

        <p><strong>Name:</strong> <span id="sName"></span></p>

        <p><strong>Domain:</strong> <span id="sDomain"></span></p>

        <p><strong>Total Fees:</strong>  ₹<span id="sTotal"></span></p>

        <p><strong>Paid Fees:</strong>  ₹<span id="sPaid"></span></p>

        <p><strong>Remaining Fees:</strong>  ₹<span id="sRemain"></span></p>

        <div class="payment-options">

            <label>Select Payment Type</label>

            <select id="paymentType" onchange="togglePartialBox()">

                <option value="FULL">Full Payment</option>

                <option value="PARTIAL">Partial Payment</option>

            </select>

            <div class="partial-box" id="partialBox">

                <input
                    type="number"
                    id="partialAmount"
                    placeholder="Enter Partial Amount"
                >
            </div>

            <button
                class="pay-btn" id="payBtn"
                onclick="continuePayment()"
            >
                Continue Payment
            </button>

        </div>

        <div id="receiptDownloadArea" aria-live="polite" style="display:none;"></div>

    </div>

    <div class="home-link">
        <a href="index.html">← Back To Home</a>
    </div>

</div>
</body>
</html>
