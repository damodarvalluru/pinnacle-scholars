<script>
window.addEventListener('load', async function () {
  var result = { ok: false };
  try {
    var waitFor = function (fn, ms) {
      ms = ms || 8000;
      return new Promise(function (resolve) {
        if (fn()) return resolve(true);
        var started = Date.now();
        var obs = new MutationObserver(function () {
          if (fn() || Date.now() - started > ms) { obs.disconnect(); resolve(fn()); }
        });
        obs.observe(document.body, { childList: true, subtree: true, attributes: true });
        setTimeout(function () { obs.disconnect(); resolve(fn()); }, ms);
      });
    };
    var toastToken = window.PinnacleLoadingFeedback.start('verification', 'TEST');
    await new Promise(function (resolve) { requestAnimationFrame(function () { resolve(); }); });
    var toast = document.querySelector('.lf-toast');
    var stage = document.querySelector('.lf-toast__stage');
    var region = document.querySelector('.lf-region');
    var css = toast ? {
      toastCount: document.querySelectorAll('.lf-toast').length,
      regionZ: getComputedStyle(region).zIndex,
      stageWidth: getComputedStyle(stage).width,
      stageHeight: getComputedStyle(stage).height,
      toastMinWidth: getComputedStyle(toast).minWidth,
      toastMaxWidth: getComputedStyle(toast).maxWidth,
      stageAfterDisplay: getComputedStyle(stage, '::after').display,
      ldDisplay: getComputedStyle(stage.querySelector('.ld')).display,
      reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      pagebarAtLoad: document.querySelectorAll('.lf-pagebar').length
    } : null;
    await waitFor(function () { return !document.querySelector('.lf-pagebar'); });
    var pagebarRemoved = !document.querySelector('.lf-pagebar');
    window.PinnacleLoadingFeedback.stop(toastToken, true);
    await waitFor(function () { return !document.querySelector('.lf-toast'); });
    var toastRemoved = !document.querySelector('.lf-toast');

    var host1 = document.createElement('div');
    host1.className = 'admin-loading';
    host1.textContent = 'Loading…';
    var host2 = document.createElement('div');
    host2.className = 'admin-loading';
    host2.textContent = 'Loading…';
    document.body.appendChild(host1);
    document.body.appendChild(host2);
    window.PinnacleLoadingFeedback.injectSkeletons();
    window.PinnacleLoadingFeedback.injectSkeletons();
    var skeleton = {
      hosts: document.querySelectorAll('.lf-skeleton-host').length,
      skeletons: document.querySelectorAll('.lf-skeleton-host .ld-skeleton').length,
      staleAdminLoading: document.querySelectorAll('.admin-loading').length
    };

    result = {
      ok: true,
      viewport: { width: window.innerWidth, height: window.innerHeight },
      css: css,
      pagebarRemoved: pagebarRemoved,
      toastRemoved: toastRemoved,
      skeleton: skeleton
    };
  } catch (e) {
    result = { ok: false, error: String((e && e.stack) || e) };
  }
  var pre = document.createElement('pre');
  pre.id = 'out';
  pre.textContent = 'RESULT ' + JSON.stringify(result);
  document.body.appendChild(pre);
});
</script></body>
